name: 'Packmerge Resource Pack Compiler'
description: 'Merge Minecraft plugin resource pack directories and .zip archives deterministically with SARIF v2.1.0 conflict diagnostics.'
author: 'Salyvn'
branding:
  icon: 'layers'
  color: 'green'

inputs:
  args:
    description: 'Arguments passed to packmerge (for example: "oraxen.zip nexo.zip --zip server-pack.zip --strict")'
    required: true
  sarif:
    description: 'Optional output path for an OASIS SARIF v2.1.0 conflict diagnostic report'
    required: false
    default: ''
  version:
    description: 'Packmerge release tag to download (defaults to v0.5.0)'
    required: false
    default: 'v0.5.0'

outputs:
  sarif-file:
    description: 'Path to the generated SARIF v2.1.0 report when the sarif input is set'
    value: ${{ inputs.sarif }}

runs:
  using: 'composite'
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Download and run packmerge
      shell: bash
      env:
        PACKMERGE_VERSION: ${{ inputs.version }}
        PACKMERGE_ARGS: ${{ inputs.args }}
        PACKMERGE_SARIF: ${{ inputs.sarif }}
      run: |
        set -euo pipefail
        VER="${PACKMERGE_VERSION#v}"
        CACHE_DIR="${RUNNER_TEMP:-/tmp}/packmerge-${VER}"
        mkdir -p "$CACHE_DIR"
        JAR="$CACHE_DIR/packmerge.jar"
        if [ ! -f "$JAR" ]; then
          curl -fsSL -o "$JAR" \
            "https://github.com/SalyyS1/packmerge/releases/download/v${VER}/packmerge.jar"
        fi
        SARIF_ARG=""
        if [ -n "$PACKMERGE_SARIF" ]; then
          SARIF_ARG="--sarif $PACKMERGE_SARIF"
        fi
        # shellcheck disable=SC2086
        java -jar "$JAR" $PACKMERGE_ARGS $SARIF_ARG

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew build --no-daemon

      - name: The CLI runs and describes itself
        run: |
          set -euo pipefail
          java -jar build/libs/packmerge.jar --version
          java -jar build/libs/packmerge.jar --help

      - name: the fixture packs merge to directory, deterministic zip, and SARIF v2.1.0
        run: |
          set -euo pipefail
          set +e
          java -jar build/libs/packmerge.jar \
            src/test/resources/plugin-a src/test/resources/plugin-b \
            --out /tmp/merged --zip /tmp/merged.zip --sarif /tmp/packmerge.sarif > /tmp/out.txt 2>&1
          code=$?
          set -e
          cat /tmp/out.txt
          test "$code" = "1" || { echo "expected exit code 1, got $code"; exit 1; }
          grep -q "resource-pack-sha1=" /tmp/out.txt
          jq -e '.version == "2.1.0" and .runs[0].tool.driver.name == "packmerge"' /tmp/packmerge.sarif
          jq -e '[.runs[0].results[].ruleId] | index("PM001") != null and index("PM002") != null and index("PM003") != null' /tmp/packmerge.sarif
          jq -e '.runs[0].results[0].locations[0].physicalLocation.artifactLocation.uriBaseId == "%SRCROOT%"' /tmp/packmerge.sarif

      - name: zip inputs, 26.3 versions flag, and json output work end-to-end
        run: |
          set -euo pipefail
          java -jar build/libs/packmerge.jar /tmp/merged.zip /tmp/merged.zip --versions 1.21.4..26.3 --zip /tmp/remerged.zip --json > /tmp/report.json
          jq -e '.errorCount == 0 and .fileCount == 9 and .maxFormat == "97" and (.zipSha1 | length == 40)' /tmp/report.json

      - name: the item table holds both packs' rows
        run: |
          set -euo pipefail
          P=/tmp/merged/assets/minecraft/models/item/paper.json
          jq -e '[.overrides[].model] == ["a:item/scroll", "a:item/note", "b:item/map", "b:item/gem"]' $P
          jq -e '.parent == "minecraft:item/generated"' $P
          grep -q "custom_model_data=2 is claimed by" /tmp/out.txt

          B=/tmp/merged/assets/minecraft/items/bow.json
          jq -e '[.model.entries[].threshold] == [1, 7]' $B
          jq -e '.model.entries[0].model.model == "b:item/warbow"' $B
          grep -q "custom_model_data 1 is claimed by both" /tmp/out.txt
          grep -q '"threshold": 1,' $B

      - name: font providers stack and the shared codepoint is named
        run: |
          set -euo pipefail
          F=/tmp/merged/assets/minecraft/font/default.json
          jq -e '.providers | length == 5' $F
          jq -e '.providers[0].type == "space"' $F
          jq -e '[.providers[].file] | map(select(. != null)) == ["a:font/icons.png", "b:font/icons.png", "b:font/badges.png"]' $F
          grep -q "U+F010 is claimed by plugin-a and plugin-b" /tmp/out.txt
          if grep -q "U+F001" /tmp/out.txt; then echo "U+F001 belongs to one pack only"; exit 1; fi

      - name: sounds, translations and atlas sources are unions
        run: |
          set -euo pipefail
          jq -e 'keys == ["a.click", "b.pop", "shared.hit"]' /tmp/merged/assets/minecraft/sounds.json
          jq -e '."shared.key" == "B"' /tmp/merged/assets/minecraft/lang/en_us.json
          jq -e '[.sources[].source] == ["a_items", "b_items"]' /tmp/merged/assets/minecraft/atlases/blocks.json
          grep -q "shared.hit (plugin-a -> plugin-b)" /tmp/out.txt

      - name: a single-owner file is taken from the later pack
        run: |
          set -euo pipefail
          grep -q "plugin-b" /tmp/merged/assets/minecraft/textures/item/paper.png
          grep -q "textures/item/paper.png" /tmp/out.txt
          if grep -q "models/item/stick.json" /tmp/out.txt; then echo "identical files are not conflicts"; exit 1; fi

      - name: pack mcmeta is the reconciled range, written for both eras
        run: |
          set -euo pipefail
          M=/tmp/merged/pack.mcmeta
          jq -e '.pack.min_format == 46' $M
          jq -e '.pack.max_format == 88' $M
          jq -e '.pack.pack_format == 46' $M
          jq -e '.pack.supported_formats == [46, 64]' $M
          jq -e '.pack.description == "plugin A items"' $M

      - name: v0.4.0 override pruning, overlay dedupe, pHash, and 26.3 sound atlas audit work end-to-end
        run: |
          set -euo pipefail
          set +e
          java -jar build/libs/packmerge.jar \
            src/test/resources/plugin-a src/test/resources/plugin-b \
            --out /tmp/merged-v040 --prune-overrides --dedupe-overlays --phash --audit-sounds \
            --sarif /tmp/v040.sarif --json > /tmp/v040.json
          code=$?
          set -e
          test "$code" = "1" || { echo "expected exit code 1, got $code"; exit 1; }
          jq -e '.prunedOverrides == 1' /tmp/v040.json
          jq -e '[.overrides[].model] == ["a:item/scroll", "b:item/map", "b:item/gem"]' /tmp/merged-v040/assets/minecraft/models/item/paper.json
          jq -e '.runs[0].tool.driver.rules | length == 22' /tmp/v040.sarif
          jq -e '[.runs[0].results[].ruleId] | index("PM015") != null and index("PM018") != null' /tmp/v040.sarif

      - name: v0.5.0 atlas sprite simulation and OGG codec audit work end-to-end
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1/assets/ns1/atlases /tmp/p2/assets/ns2/atlases /tmp/p2/assets/ns2/sounds
          printf '{"pack":{"pack_format":46,"description":"p1"}}\n' > /tmp/p1/pack.mcmeta
          printf '{"pack":{"pack_format":46,"description":"p2"}}\n' > /tmp/p2/pack.mcmeta
          printf '{"sources":[{"type":"single","resource":"shared:item/icon"}]}\n' > /tmp/p1/assets/ns1/atlases/blocks.json
          printf '{"sources":[{"type":"single","resource":"shared:item/icon"}]}\n' > /tmp/p2/assets/ns2/atlases/blocks.json
          python3 -c 'pkt=b"OpusHead\x01\x02\x00\x00\x80\xbb\x00\x00\x00\x00\x00"; open("/tmp/p2/assets/ns2/sounds/bad.ogg","wb").write(b"OggS\x00\x02"+b"\x00"*20+bytes([1,len(pkt)])+pkt)'
          set +e
          java -jar build/libs/packmerge.jar /tmp/p1 /tmp/p2 \
            --out /tmp/merged-v050 --audit-atlas --audit-audio \
            --sarif /tmp/v050.sarif --json > /tmp/v050.json
          code=$?
          set -e
          test "$code" = "1" || { echo "expected exit code 1, got $code"; exit 1; }
          jq -e '[.runs[0].results[].ruleId] | index("PM019") != null and index("PM020") != null and index("PM021") != null' /tmp/v050.sarif

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: packmerge-jar
          path: build/libs/packmerge.jar
          if-no-files-found: error

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew build --no-daemon

      - name: The CLI runs and describes itself
        run: |
          set -euo pipefail
          java -jar build/libs/packmerge.jar --version
          java -jar build/libs/packmerge.jar --help

      - name: the fixture packs merge to directory and deterministic zip
        run: |
          set -euo pipefail
          set +e
          java -jar build/libs/packmerge.jar \
            src/test/resources/plugin-a src/test/resources/plugin-b \
            --out /tmp/merged --zip /tmp/merged.zip > /tmp/out.txt 2>&1
          code=$?
          set -e
          cat /tmp/out.txt
          test "$code" = "1" || { echo "expected exit code 1, got $code"; exit 1; }
          grep -q "resource-pack-sha1=" /tmp/out.txt

      - name: zip inputs and json output work end-to-end
        run: |
          set -euo pipefail
          java -jar build/libs/packmerge.jar /tmp/merged.zip /tmp/merged.zip --zip /tmp/remerged.zip --json > /tmp/report.json
          jq -e '.errorCount == 0 and .fileCount == 9 and (.zipSha1 | length == 40)' /tmp/report.json

      - name: the item table holds both packs' rows
        run: |
          set -euo pipefail
          P=/tmp/merged/assets/minecraft/models/item/paper.json
          jq -e '[.overrides[].model] == ["a:item/scroll", "a:item/note", "b:item/map", "b:item/gem"]' $P
          jq -e '.parent == "minecraft:item/generated"' $P
          grep -q "custom_model_data=2 is claimed by" /tmp/out.txt

          B=/tmp/merged/assets/minecraft/items/bow.json
          jq -e '[.model.entries[].threshold] == [1, 7]' $B
          jq -e '.model.entries[0].model.model == "b:item/warbow"' $B
          grep -q "custom_model_data 1 is claimed by both" /tmp/out.txt
          grep -q '"threshold": 1,' $B

      - name: font providers stack and the shared codepoint is named
        run: |
          set -euo pipefail
          F=/tmp/merged/assets/minecraft/font/default.json
          jq -e '.providers | length == 5' $F
          jq -e '.providers[0].type == "space"' $F
          jq -e '[.providers[].file] | map(select(. != null)) == ["a:font/icons.png", "b:font/icons.png", "b:font/badges.png"]' $F
          grep -q "U+F010 is claimed by plugin-a and plugin-b" /tmp/out.txt
          if grep -q "U+F001" /tmp/out.txt; then echo "U+F001 belongs to one pack only"; exit 1; fi

      - name: sounds, translations and atlas sources are unions
        run: |
          set -euo pipefail
          jq -e 'keys == ["a.click", "b.pop", "shared.hit"]' /tmp/merged/assets/minecraft/sounds.json
          jq -e '."shared.key" == "B"' /tmp/merged/assets/minecraft/lang/en_us.json
          jq -e '[.sources[].source] == ["a_items", "b_items"]' /tmp/merged/assets/minecraft/atlases/blocks.json
          grep -q "shared.hit (plugin-a -> plugin-b)" /tmp/out.txt

      - name: a single-owner file is taken from the later pack
        run: |
          set -euo pipefail
          grep -q "plugin-b" /tmp/merged/assets/minecraft/textures/item/paper.png
          grep -q "textures/item/paper.png" /tmp/out.txt
          if grep -q "models/item/stick.json" /tmp/out.txt; then echo "identical files are not conflicts"; exit 1; fi

      - name: pack mcmeta is the reconciled range, written for both eras
        run: |
          set -euo pipefail
          M=/tmp/merged/pack.mcmeta
          jq -e '.pack.min_format == 46' $M
          jq -e '.pack.max_format == 88' $M
          jq -e '.pack.pack_format == 46' $M
          jq -e '.pack.supported_formats == [46, 64]' $M
          jq -e '.pack.description == "plugin A items"' $M

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: packmerge-jar
          path: build/libs/packmerge.jar
          if-no-files-found: error
